apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev            # puts every resource into the dev namespace

resources:
  - namespace.yaml
  - ../../base

# CHANGE: your Docker Hub username and image tag
images:
  - name: auth-service
    newName: manojgk1089/auth-service
    newTag: "v1.12"

replicas:
  - name: auth-service
    count: 2