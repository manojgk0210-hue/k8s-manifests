apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: dev
  labels:
    app: account-service
spec:
  replicas: 1            # raise to 2 after the nodes are upgraded (t3.medium)
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          # CHANGE: must match IMAGE_NAME in your pipeline; use a tag that exists on Docker Hub
          image: manojgk1089/account-service:v1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: account-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: account-secrets
                  key: JWT_SECRET
          startupProbe:
            httpGet:
              path: /api/accounts/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/accounts/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/accounts/health
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi